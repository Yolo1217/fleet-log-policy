name: ci

on:
  push:
    branches:
      - main
      - 'dev/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: 质量门禁（vet / 单测 / 覆盖率 / 竞态）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 依赖整理检查
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: 编译
        run: go build ./...
      - name: 静态检查
        run: go vet ./...
      - name: 单元测试与覆盖率采集
        run: go test -count=1 ./internal/fleetlog/... -coverpkg=./internal/fleetlog/... -coverprofile=coverage.out
      - name: 覆盖率门禁（≥85%）
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/{print $3}' | tr -d '%')
          echo "整体覆盖率：${total}%"
          awk -v t="${total}" 'BEGIN{if (t+0 < 85) {print "覆盖率低于 85%"; exit 1}}'
      - name: 竞态检测（CI 环境支持 CGO，本机无法执行）
        run: go test -race -count=1 ./internal/fleetlog/...
      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  business-rules:
    name: 业务规则黑盒核查（自编 Skill）
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 运行业务专项 Skill 脚本
        run: |
          python3 .codebuddy/skills/fleet-log-policy-check/scripts/check_business_rules.py \
            --start --report business-check.json
      - name: 上传核查证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-check
          path: business-check.json

  build:
    name: 构建部署制品
    runs-on: ubuntu-latest
    needs: [test, business-rules]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 构建网关制品
        run: go build -trimpath -o gateway-linux ./cmd/gateway
      - name: 记录部署版本
        run: |
          {
            echo "commit=$(git rev-parse --short HEAD)"
            echo "build_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "run_id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } > deploy-info.txt
          cat deploy-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-artifact
          path: |
            gateway-linux
            deploy-info.txt
            db/schema.sql

  deploy:
    name: 部署 + 健康检查 + 业务冒烟
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gateway-artifact
      - name: 部署版本信息
        run: cat deploy-info.txt
      - name: 启动服务（runner 即部署目标；教学环境无 MySQL 服务，使用隔离存储，主库部署由 deploy/deploy.ps1 承担）
        run: |
          chmod +x gateway-linux
          export FLEETLOG_DB_PATH="$RUNNER_TEMP/fleetlog-deploy.db"
          export FLEETLOG_TIMEOUT_SECONDS=8
          nohup ./gateway-linux > gateway.out 2> gateway.err &
          echo $! > gateway.pid
      - name: 健康检查
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/healthz | grep -q '"ok"'; then
              echo "健康检查通过"; exit 0
            fi
            sleep 1
          done
          echo "健康检查失败"; cat gateway.err || true; exit 1
      - name: 业务冒烟（自编 Skill 黑盒核查，共 49 项）
        run: |
          python3 .codebuddy/skills/fleet-log-policy-check/scripts/check_business_rules.py \
            --base-url http://127.0.0.1:8080 --timeout-seconds 8 --report deploy-smoke.json
      - name: 服务运行日志
        if: always()
        run: |
          tail -n 20 gateway.out || true
          tail -n 20 gateway.err || true
      - name: 上传部署证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-evidence
          path: |
            gateway.out
            gateway.err
            deploy-smoke.json
            deploy-info.txt
